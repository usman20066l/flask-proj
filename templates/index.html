<!DOCTYPE html>
<html>

<head>
    <title>Student Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 5px rgba(108, 99, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4a0a00;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #574bdb;
        }
    </style>
</head>

<body>

    <div class="form-container">

        <form action="/submittodoitem" method="POST">

            <input type="text" name="itemName" placeholder="Item Name">

            <input type="text" name="itemDescription" placeholder="Item Description">

            <button type="submit">Submit</button>


        </form>

    </div>

</body>

</html>
